# Demo de Neutron con Docker Compose (sin Aspire ni .NET instalados).
#   docker compose up --build
# Luego abre http://localhost:8080 (o el puerto de GATEWAY_PORT)  (portada · /campo · /panel · /backoffice · /api)
name: neutron-demo

services:
  # API de demo: finca semilla, simulador de sensores, reglas, escenarios e impacto.
  api:
    build:
      context: ./aspire
      dockerfile: Dockerfile
      args:
        PROJECT: Neutron.DemoApi
    environment:
      ASPNETCORE_URLS: http://+:80
      TZ: Europe/Madrid
    # Nombres únicos (los mismos que en Aspire): en la red compartida de Dokploy
    # puede haber otros contenedores llamados "api" o "web".
    networks:
      default:
        aliases: [neutron-api]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q Healthy <&3'"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Frontend estático (Vite + nginx) con las apps /campo, /panel y /backoffice.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      default:
        aliases: [neutron-web]
    restart: unless-stopped

  # Gateway YARP: único punto de entrada.
  gateway:
    build:
      context: ./aspire
      dockerfile: Dockerfile
      args:
        PROJECT: Neutron.Gateway
    # Red explícita: si Dokploy añade su red (dokploy-network) para el dominio,
    # el gateway sigue viendo a neutron-api y neutron-web en la red interna.
    networks:
      - default
    # Puerto del host configurable (en Dokploy suele estar ocupado el 8080).
    # Con un dominio de Dokploy usa GATEWAY_PORT=127.0.0.1:8090 para no exponer el puerto ni la IP.
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

